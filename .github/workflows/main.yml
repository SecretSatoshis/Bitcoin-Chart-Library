name: Update Bitcoin Charts

on:
  pull_request:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: update-charts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Run regression tests
        run: uv run --no-sync pytest -q

      - name: Generate charts
        if: github.event_name != 'pull_request'
        run: uv run --no-sync python main.py

      - name: Upload generated charts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-charts-${{ github.run_id }}
          path: Charts/
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download validated charts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: generated-charts-${{ github.run_id }}
          path: Charts/

      - name: Commit and push charts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add Charts/
          git diff --cached --quiet || git commit -m "Update Charts"
          gh auth setup-git
          git pull --rebase origin main
          git push origin HEAD:main
