name: Update Bitcoin Charts

# Vercel builds and publishes the chart site from `main` on every push, and the Report
# Library's workflow asks it to rebuild after each release. Pull requests verify against a
# checked-in deterministic fixture release so upstream outages never block merges; pushes to
# `main` and manual dispatches verify against the live Report Library release.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: update-charts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Refresh TLS certificate trust
        uses: SecretSatoshis/.github/actions/refresh-tls-trust@deb19758624b41175b649a18223ee978bab34bcc
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python and uv
        uses: SecretSatoshis/.github/actions/setup-python-uv@deb19758624b41175b649a18223ee978bab34bcc
        with:
          python-version: "3.12"
          uv-version: "0.13.4"

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Lint Python with ruff
        run: uvx ruff check --select E9,F63,F7,F82,F401 .

      - name: Build charts from deterministic fixture (PR)
        if: github.event_name == 'pull_request'
        run: uv run --no-sync python main.py --csv-dir tests/fixtures/sample-release --frozen-report-date 2026-09-29

      - name: Build charts from the live release (main / dispatch)
        if: github.event_name != 'pull_request'
        run: uv run --no-sync python main.py

      - name: Run regression tests
        run: uv run --no-sync pytest -q

      - name: Set up browser tooling
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Check JS syntax
        run: |
          node --check web/renderer.js
          node --check web/catalog/assets/catalog.js
          node --check web/catalog/assets/analytics.js

      - name: Install pinned browser checks
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Verify charts in browser
        run: |
          npm run test:reference-levels
          npm run test:browser
          npm run test:candles
          npm run test:panels

  rebuild:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Refresh TLS certificate trust
        uses: SecretSatoshis/.github/actions/refresh-tls-trust@deb19758624b41175b649a18223ee978bab34bcc
      - name: Ask Vercel to rebuild the chart site
        env:
          DEPLOY_HOOK: ${{ secrets.CHARTS_DEPLOY_HOOK_URL }}
        run: |
          test -n "$DEPLOY_HOOK" || { echo "::error::CHARTS_DEPLOY_HOOK_URL secret is not set"; exit 1; }
          curl --fail --silent --show-error -X POST "$DEPLOY_HOOK" > /dev/null
