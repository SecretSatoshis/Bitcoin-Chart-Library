name: Update Bitcoin Charts

# Vercel builds and publishes the chart site from `main` on every push, and the Report
# Library's workflow asks it to rebuild after each release. This workflow tests every
# change against the live release; a manual run also rebuilds the site.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: update-charts-${{ github.ref }}
  cancel-in-progress: false

# Use the runner's refreshed CA bundle rather than Node's embedded roots.
env:
  NODE_OPTIONS: --use-openssl-ca
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Refresh TLS certificate trust
        working-directory: ${{ runner.temp }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install --only-upgrade -y ca-certificates
          # Enforce the emergency distrust even if this runner's apt mirror lags.
          sudo sed -i \
            -e 's|^mozilla/emSign_ECC_Root_CA_-_G3.crt$|!&|' \
            -e 's|^mozilla/emSign_Root_TLS_CA_-_G3.crt$|!&|' \
            -e 's|^mozilla/Comodo_AAA_Services_root.crt$|!&|' \
            /etc/ca-certificates.conf
          sudo update-ca-certificates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.4"

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Build charts from the live release
        run: uv run --no-sync python main.py

      - name: Run regression tests
        run: uv run --no-sync pytest -q

      - name: Set up browser tooling
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Install pinned browser checks
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Verify charts in HTTP and direct-file browsers
        run: |
          npm run test:reference-levels
          npm run test:browser
          npm run test:candles
          npm run test:panels

  rebuild:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Refresh TLS certificate trust
        working-directory: ${{ runner.temp }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install --only-upgrade -y ca-certificates
          # Enforce the emergency distrust even if this runner's apt mirror lags.
          sudo sed -i \
            -e 's|^mozilla/emSign_ECC_Root_CA_-_G3.crt$|!&|' \
            -e 's|^mozilla/emSign_Root_TLS_CA_-_G3.crt$|!&|' \
            -e 's|^mozilla/Comodo_AAA_Services_root.crt$|!&|' \
            /etc/ca-certificates.conf
          sudo update-ca-certificates
      - name: Ask Vercel to rebuild the chart site
        env:
          DEPLOY_HOOK: ${{ secrets.CHARTS_DEPLOY_HOOK_URL }}
        run: |
          test -n "$DEPLOY_HOOK" || { echo "::error::CHARTS_DEPLOY_HOOK_URL secret is not set"; exit 1; }
          curl --fail --silent --show-error -X POST "$DEPLOY_HOOK" > /dev/null
