name: Update Bitcoin Charts

# Vercel builds and publishes the chart site from `main` on every push. This workflow
# tests each change against the live release and, hourly, asks Vercel to rebuild once
# the Report Library publishes a new release.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "45 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: update-charts-${{ github.ref }}-${{ github.event_name == 'schedule' }}
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.5"

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Build charts from the live release
        run: uv run --no-sync python main.py

      - name: Run regression tests
        run: uv run --no-sync pytest -q

      - name: Set up browser tooling
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install pinned browser checks
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Verify charts in HTTP and direct-file browsers
        run: |
          npm run test:browser
          npm run test:candles
          npm run test:panels

  refresh:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Compare published and live releases
        id: status
        run: python3 scripts/release-status.py

      # A manual run always rebuilds.
      - name: Ask Vercel to rebuild the chart site
        if: steps.status.outputs.build == 'true' || github.event_name == 'workflow_dispatch'
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          test -n "$DEPLOY_HOOK" || { echo "::error::VERCEL_DEPLOY_HOOK_URL secret is not set"; exit 1; }
          curl --fail --silent --show-error -X POST "$DEPLOY_HOOK" > /dev/null
          echo "Rebuild requested for release ${{ steps.status.outputs.release }}"
