version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 5
  # Pinned Playwright for the browser regression checks.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      browser-tooling:
        patterns:
          - "*"
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 5

